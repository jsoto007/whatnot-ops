name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  api:
    # Pinned: ubuntu-latest became 26.04, which has no prebuilt Python 3.13.5
    # (.python-version, the same version Render runs).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: whatnot_ops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/whatnot_ops_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/whatnot_ops_test
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extension:
    # Pinned: ubuntu-latest became 26.04, which has no prebuilt Python 3.13.5
    # (.python-version, the same version Render runs).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: whatnot_ops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # The Playwright suite starts the real API (APP_ENV=test) against this database.
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/whatnot_ops_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/whatnot_ops_test
      SECRET_KEY: ci
      FLASK_BIN: flask
      JOBS_INLINE: "1"
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: extension/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip, cache-dependency-path: api/requirements.txt }
      - run: pip install -r ../api/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Portal → download → pair → capture → parsed sales; needs the web app built.
      - run: npm ci --prefix ../web
      - run: npm run test:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: extension-playwright-report, path: extension/playwright-report }

  e2e:
    # Pinned: ubuntu-latest became 26.04, which has no prebuilt Python 3.13.5
    # (.python-version, the same version Render runs).
    runs-on: ubuntu-24.04
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: whatnot_ops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci
      JOBS_INLINE: "1"
      AI_PROVIDER: fake
      WHATNOT_API: fake  # an in-memory Whatnot; CI never holds a real token
      # The suite signs up many shops from 127.0.0.1; honoured only outside production.
      RATE_LIMITS: "off"
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/whatnot_ops
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/whatnot_ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip, cache-dependency-path: api/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -r api/requirements.txt
      - run: cd web && npm ci && npm run build
      - run: cd web && npx playwright install --with-deps chromium
      - name: Start Flask (serves web/dist) and run Playwright
        run: |
          (cd api && flask --app wsgi.py db upgrade && gunicorn --bind 127.0.0.1:5055 wsgi:app &) 
          for i in $(seq 1 30); do curl -sf http://localhost:5055/api/health && break; sleep 1; done
          cd web && E2E_BASE_URL=http://localhost:5055 PW_CHANNEL=chromium npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }
