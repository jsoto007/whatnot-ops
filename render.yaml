# Render Blueprint — https://render.com/docs/blueprint-spec
# One Python web service builds the React app and serves it through Flask
# (api/app/spa.py): same origin, session cookies, no CORS. A background worker
# runs the jobs table (parsing, AI supervision). See docs/RUNBOOK.md.
#
# Before syncing:
#   • Create the Blueprint only with Javier's OK; changing envVars here and
#     merging to main redeploys production.
#   • Postgres is on a paid plan on purpose: free databases expire after 30 days.
#   • Check workspace billing first when a deploy fails for no visible reason.
#   • First deploy: confirm Render's Python runtime provides Node (NODE_VERSION)
#     for the web build; if not, switch the web service to a Docker runtime.

databases:
  # Keeps its original name on purpose: production data lives here, and a
  # renamed database resource would be a NEW, empty one. The name is internal
  # (never in a URL); only the services were renamed to sales-ops.
  - name: whatnot-ops-db
    plan: basic-256mb
    databaseName: whatnot_ops
    user: whatnot_ops
    # No connections from the internet: the services use the private network
    # (connectionString). Add a specific IP here only when one is needed.
    ipAllowList: []

services:
  # Renamed from whatnot-ops (2026-10-24) so the public URL is
  # sales-ops.onrender.com. Render never changes an existing service's
  # onrender.com slug, so syncing this creates NEW web + worker services (the
  # old pair stays until deleted in the dashboard). Dashboard-only env vars
  # (ADMIN_EMAIL, MAILGUN_*, AI_*) must be entered again on the new services,
  # SECRET_KEY is regenerated (everyone signs in again) and every laptop must
  # download the extension again so its baked-in portal address is the new one.
  - type: web
    name: sales-ops
    runtime: python
    plan: starter
    # The extension is built here too: Settings → Laptops serves it as a zip
    # (api/app/routes/extension.py) with this portal's address baked in.
    buildCommand: >-
      cd web && npm ci && npm run build
      && cd ../extension && npm ci && npm run build && cd ../api
      && pip install -r requirements.txt
    startCommand: >-
      cd api && flask --app wsgi.py db upgrade
      && flask --app wsgi.py ensure-support
      && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.14.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: whatnot-ops-db
          property: connectionString
      # The shop's admin (protected owner). Only this email can create the shop
      # on /signup, once; nobody can demote or disable it in the app. Without it
      # production never opens sign-up. Set it in the dashboard before first visit.
      - key: ADMIN_EMAIL
        sync: false
      # One-time code for creating the shop (read it in Render → Environment).
      # Knowing ADMIN_EMAIL alone is not enough to claim the shop.
      - key: SETUP_TOKEN
        generateValue: true
      # Optional developer support account (services/support.py): an owner the
      # shop cannot demote or disable, created/repaired at every start from these
      # two values. Set both in the dashboard or neither.
      #   IT_SUPPORT=<email>  IT_SUPPORT_PASSWORD=<10+ characters>
      # APP_URL (links in invite / reset emails) — set once a custom domain exists;
      # until then the app uses RENDER_EXTERNAL_URL.
      # - key: APP_URL
      #   value: https://ops.example.com
      #
      # Add in the dashboard when ready (never commit values):
      #   MAILGUN_API_KEY, MAILGUN_DOMAIN, EMAIL_FROM                 invites + password resets
      #   AI_PROVIDER=claude|jev, ANTHROPIC_API_KEY / JEV_API_KEY (+ JEV_API_URL, JEV_MODEL)
      #   (set the same AI_* values on the worker; that is where the jobs run)
      #   LOG_LEVEL=INFO

  # Background worker: parsing, AI supervision, exports (jobs table, SKIP LOCKED).
  - type: worker
    name: sales-ops-worker
    runtime: python
    plan: starter
    buildCommand: cd api && pip install -r requirements.txt
    startCommand: cd api && python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: sales-ops
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: whatnot-ops-db
          property: connectionString
      - key: WORKER_POLL_SECONDS
        value: "2"
