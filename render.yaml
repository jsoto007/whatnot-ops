# Render Blueprint — https://render.com/docs/blueprint-spec
# One Python web service builds the React app and serves it through Flask
# (api/app/spa.py): same origin, session cookies, no CORS. A background worker
# runs the jobs table (parsing, AI supervision). See docs/RUNBOOK.md.
#
# Before syncing:
#   • Create the Blueprint only with Javier's OK; changing envVars here and
#     merging to main redeploys production.
#   • Postgres is on a paid plan on purpose: free databases expire after 30 days.
#   • Check workspace billing first when a deploy fails for no visible reason.
#   • First deploy: confirm Render's Python runtime provides Node (NODE_VERSION)
#     for the web build; if not, switch the web service to a Docker runtime.

databases:
  - name: whatnot-ops-db
    plan: basic-256mb
    databaseName: whatnot_ops
    user: whatnot_ops

services:
  - type: web
    name: whatnot-ops
    runtime: python
    plan: starter
    # The extension is built here too: Settings → Laptops serves it as a zip
    # (api/app/routes/extension.py) with this portal's address baked in.
    buildCommand: >-
      cd web && npm ci && npm run build
      && cd ../extension && npm ci && npm run build && cd ../api
      && pip install -r requirements.txt
    startCommand: >-
      cd api && flask --app wsgi.py db upgrade
      && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.14.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: whatnot-ops-db
          property: connectionString
      # The shop's admin (protected owner). Only this email can create the shop
      # on /signup, once; nobody can demote or disable it in the app. Without it
      # production never opens sign-up. Set it in the dashboard before first visit.
      - key: ADMIN_EMAIL
        sync: false
      # APP_URL (links in invite / reset emails) — set once a custom domain exists;
      # until then the app uses RENDER_EXTERNAL_URL.
      # - key: APP_URL
      #   value: https://ops.example.com
      #
      # Add in the dashboard when ready (never commit values):
      #   MAILGUN_API_KEY, MAILGUN_DOMAIN, EMAIL_FROM                 invites + password resets
      #   AI_PROVIDER=claude|jev, ANTHROPIC_API_KEY / JEV_API_KEY (+ JEV_API_URL, JEV_MODEL)
      #   (set the same AI_* values on the worker; that is where the jobs run)
      #   LOG_LEVEL=INFO

  # Background worker: parsing, AI supervision, exports (jobs table, SKIP LOCKED).
  - type: worker
    name: whatnot-ops-worker
    runtime: python
    plan: starter
    buildCommand: cd api && pip install -r requirements.txt
    startCommand: cd api && python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false # paste the web service's value
      - key: DATABASE_URL
        fromDatabase:
          name: whatnot-ops-db
          property: connectionString
      - key: WORKER_POLL_SECONDS
        value: "2"
