[project]
name = "whatnot-ops-api"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/env.py", "migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
