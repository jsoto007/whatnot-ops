<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>$heading</title>
</head>
<body style="margin:0;padding:0;background:$bg;-webkit-font-smoothing:antialiased;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:$bg;font-size:1px;line-height:1px;">$preheader&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:$bg;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;font-family:$font;">

<tr><td style="background:$navy;border-bottom:3px solid $green;border-radius:12px 12px 0 0;padding:20px 32px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding-right:12px;"><a href="$home" style="text-decoration:none;"><img src="$logo" width="40" height="40" alt="" style="display:block;width:40px;height:40px;border-radius:10px;border:0;"></a></td>
<td style="font-family:$font;font-size:18px;font-weight:600;color:#ffffff;letter-spacing:-0.01em;"><a href="$home" style="color:#ffffff;text-decoration:none;">$app_name</a></td>
</tr></table>
</td></tr>

<tr><td style="background:$surface;border:1px solid $border;border-top:0;padding:36px 32px 32px;">
<h1 style="margin:0 0 16px;font-family:$font;font-size:22px;line-height:1.3;font-weight:700;color:$text;letter-spacing:-0.01em;">$heading</h1>
$body
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 12px;"><tr>
<td style="border-radius:8px;background:$green;">
<a href="$url" style="display:inline-block;padding:14px 28px;font-family:$font;font-size:15px;font-weight:600;line-height:1;color:$navy_ink;text-decoration:none;border-radius:8px;">$button_label</a>
</td></tr></table>
<p style="margin:0 0 28px;font-size:13px;line-height:1.5;color:$muted;">$expiry</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="background:$surface_2;border:1px solid $border;border-radius:8px;padding:12px 16px;">
<p style="margin:0 0 6px;font-size:12px;line-height:1.5;color:$muted;">Button not working? Copy this link into your browser:</p>
<a href="$url" style="font-family:$mono;font-size:12px;line-height:1.5;color:$navy;word-break:break-all;text-decoration:underline;">$url</a>
</td></tr></table>
</td></tr>

<tr><td style="padding:20px 32px 0;">
<p style="margin:0 0 6px;font-family:$font;font-size:12px;line-height:1.6;color:$faint;">$footer</p>
<p style="margin:0;font-family:$font;font-size:12px;line-height:1.6;color:$faint;">Sent by <a href="$home" style="color:$faint;text-decoration:underline;">$app_name</a>, the live-show operations app.</p>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
