<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: Whatnot-like live chat</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #eee; display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  .video { display: grid; place-items: center; color: #666; }
  .chat-panel { display: flex; flex-direction: column; border-left: 1px solid #333; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 8px; }
  .msg-row, .msg-row-v2 { padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; background: #1b1b1b; }
  .msg-user { font-weight: 600; color: #ffd166; margin-right: 6px; }
  .msg-row-v2 .msg-user { color: #06d6a0; }
  .composer { padding: 8px; border-top: 1px solid #333; }
  .composer input { width: 100%; box-sizing: border-box; padding: 6px; }
</style>
</head>
<body>
  <div class="video">
    <!-- Same shape as Whatnot's player footer (see tests/fixtures/player.ts): status line,
         item title, and the price next to the countdown or "Sold". Driven by window.__player. -->
    <section data-testid="live-player">live video here<footer id="player-footer"></footer></section>
  </div>
  <div class="chat-panel">
    <div class="chat-scroll" id="scroll">
      <div class="msg-list" id="list"></div>
    </div>
    <div class="composer"><input placeholder="Say something" aria-label="composer"></div>
  </div>
<script>
  // Test API used by the Playwright suite to imitate what Whatnot does to the DOM.
  (() => {
    let rowClass = 'msg-row';
    let n = 0;
    const list = () => document.getElementById('list');
    function make(user, text) {
      const d = document.createElement('div');
      d.className = rowClass;
      const u = document.createElement('span'); u.className = 'msg-user'; u.textContent = user;
      const t = document.createElement('span'); t.className = 'msg-text'; t.textContent = text;
      d.append(u, t);
      return d;
    }
    const api = {
      append(user, text) {
        n++;
        const l = list();
        l.appendChild(make(user, text));
        // Like a real long chat: only the newest rows stay in the page.
        if (api.keep) while (l.children.length > api.keep) l.firstElementChild.remove();
        return n;
      },
      appendMany(count, prefix = 'user') {
        for (let i = 0; i < count; i++) api.append(prefix + (n + 1), 'message ' + (n + 1));
        return n;
      },
      // Whatnot redraws recent rows as brand-new nodes with the same text.
      rerender(k = 5) {
        const rows = [...list().children].slice(-k);
        for (const r of rows) {
          const copy = make(r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent);
          r.replaceWith(copy);
        }
      },
      // A framework re-render: every row becomes a brand-new node, same list, same order.
      rerenderAll() {
        const l = list();
        const rows = [...l.children].map((r) => [r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent]);
        l.replaceChildren(...rows.map(([u, t]) => make(u, t)));
      },
      // A deploy changes the class names on every row, old and new.
      swapClasses(next = 'msg-row-v2') {
        rowClass = next;
        for (const r of list().children) r.className = next;
      },
      // The whole scroll container gets replaced (route change / reconnect).
      replaceContainer() {
        const old = document.getElementById('scroll');
        const fresh = old.cloneNode(false);
        const newList = document.createElement('div'); newList.className = 'msg-list'; newList.id = 'list';
        for (const r of list().children) newList.appendChild(make(r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent));
        fresh.appendChild(newList);
        old.replaceWith(fresh);
      },
      // The chat unmounts (Whatnot switching panels, a reconnect) and later comes back as new nodes.
      removeChat() {
        const old = document.getElementById('scroll');
        api.saved = [...list().children].map((r) => [r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent]);
        old.remove();
      },
      restoreChat() {
        const fresh = document.createElement('div'); fresh.className = 'chat-scroll'; fresh.id = 'scroll';
        const l = document.createElement('div'); l.className = 'msg-list'; l.id = 'list';
        for (const [u, t] of api.saved ?? []) l.appendChild(make(u, t));
        fresh.appendChild(l);
        document.querySelector('.chat-panel').prepend(fresh);
      },
      // Another list on the page that looks like rows (product cards): never the chat.
      addShop(k = 8) {
        const shop = document.createElement('div'); shop.className = 'shop';
        for (let i = 0; i < k; i++) { const c = document.createElement('div'); c.className = 'card'; c.textContent = 'Item ' + i; shop.appendChild(c); }
        document.querySelector('.video').appendChild(shop);
        return shop;
      },
      addCard(text) { const c = document.createElement('div'); c.className = 'card'; c.textContent = text; document.querySelector('.shop').appendChild(c); },
      count() { return n; },
    };
    window.__chat = api;

    const footer = () => document.getElementById('player-footer');
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const item = (title) => `<section><button type="button"><strong data-testid="show-product-title">${esc(title)}</strong><strong>12 Bids</strong></button>`;
    window.__player = {
      idle(title, price = '$1') { footer().innerHTML = item(title) + `<section class="ml-3"><strong>${esc(price)}</strong><strong data-testid="show-timer">00:20</strong></section></section>`; },
      bidding(name, price, title) { footer().innerHTML = `<div><strong data-testid="show-winning-status">${esc(name)} is <strong>Winning!</strong></strong></div>` + item(title) + `<section class="ml-3"><strong>${esc(price)}</strong><strong data-testid="show-timer">00:03</strong></section></section>`; },
      won(name, price, title) { footer().innerHTML = `<div><strong data-testid="show-winning-status">${esc(name)} <strong>won!</strong></strong><strong>bid $1.00</strong></div>` + item(title) + `<section class="ml-3"><strong>${esc(price)}</strong><strong>Sold</strong></section></section>`; },
      // A card declined after the win, shown in the footer (made-up markup: no real decline captured yet).
      declined(text = 'Payment declined') { const d = document.createElement('div'); const s = document.createElement('span'); s.textContent = text; d.appendChild(s); footer().prepend(d); },
    };
    // The show's Sold tab (outside the chat): one row per item sold, with a status. Made-up markup.
    window.__sold = {
      add(buyer, title, price, status = 'Paid') {
        let tab = document.getElementById('sold-tab');
        if (!tab) { tab = document.createElement('div'); tab.id = 'sold-tab'; tab.setAttribute('role', 'tabpanel'); document.querySelector('.video').appendChild(tab); }
        const row = document.createElement('div'); row.className = 'row';
        for (const t of ['@' + buyer, title, price, status]) { const s = document.createElement('span'); s.textContent = t; row.appendChild(s); }
        tab.appendChild(row);
        return row;
      },
    };
    api.appendMany(10, 'seed');
  })();
</script>
</body>
</html>
