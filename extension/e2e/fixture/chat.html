<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: Whatnot-like live chat</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #eee; display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  .video { display: grid; place-items: center; color: #666; }
  .chat-panel { display: flex; flex-direction: column; border-left: 1px solid #333; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 8px; }
  .msg-row, .msg-row-v2 { padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; background: #1b1b1b; }
  .msg-user { font-weight: 600; color: #ffd166; margin-right: 6px; }
  .msg-row-v2 .msg-user { color: #06d6a0; }
  .composer { padding: 8px; border-top: 1px solid #333; }
  .composer input { width: 100%; box-sizing: border-box; padding: 6px; }
</style>
</head>
<body>
  <div class="video">live video here</div>
  <div class="chat-panel">
    <div class="chat-scroll" id="scroll">
      <div class="msg-list" id="list"></div>
    </div>
    <div class="composer"><input placeholder="Say something" aria-label="composer"></div>
  </div>
<script>
  // Test API used by the Playwright suite to imitate what Whatnot does to the DOM.
  (() => {
    let rowClass = 'msg-row';
    let n = 0;
    const list = () => document.getElementById('list');
    function make(user, text) {
      const d = document.createElement('div');
      d.className = rowClass;
      const u = document.createElement('span'); u.className = 'msg-user'; u.textContent = user;
      const t = document.createElement('span'); t.className = 'msg-text'; t.textContent = text;
      d.append(u, t);
      return d;
    }
    const api = {
      append(user, text) { n++; list().appendChild(make(user, text)); return n; },
      appendMany(count, prefix = 'user') {
        for (let i = 0; i < count; i++) api.append(prefix + (n + 1), 'message ' + (n + 1));
        return n;
      },
      // Whatnot redraws recent rows as brand-new nodes with the same text.
      rerender(k = 5) {
        const rows = [...list().children].slice(-k);
        for (const r of rows) {
          const copy = make(r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent);
          r.replaceWith(copy);
        }
      },
      // A framework re-render: every row becomes a brand-new node, same list, same order.
      rerenderAll() {
        const l = list();
        const rows = [...l.children].map((r) => [r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent]);
        l.replaceChildren(...rows.map(([u, t]) => make(u, t)));
      },
      // A deploy changes the class names on every row, old and new.
      swapClasses(next = 'msg-row-v2') {
        rowClass = next;
        for (const r of list().children) r.className = next;
      },
      // The whole scroll container gets replaced (route change / reconnect).
      replaceContainer() {
        const old = document.getElementById('scroll');
        const fresh = old.cloneNode(false);
        const newList = document.createElement('div'); newList.className = 'msg-list'; newList.id = 'list';
        for (const r of list().children) newList.appendChild(make(r.querySelector('.msg-user').textContent, r.querySelector('.msg-text').textContent));
        fresh.appendChild(newList);
        old.replaceWith(fresh);
      },
      count() { return n; },
    };
    window.__chat = api;
    api.appendMany(10, 'seed');
  })();
</script>
</body>
</html>
