<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Scraper — Settings</title>
<link rel="icon" href="icon48.png">
<style>
  :root { --navy: #002244; --navy2: #001833; --navy3: #0B3A66; --green: #69BE28; --grey: #A5ACAF; --red: #FF8A80; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy2); color: #fff; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--navy); border-bottom: 3px solid var(--green); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header img { width: 32px; height: 32px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--grey); }
  input { height: 40px; border: 1px solid var(--navy3); background: var(--navy); color: #fff; border-radius: 8px; padding: 0 10px; font: inherit; }
  input:focus { outline: 2px solid var(--green); outline-offset: 0; }
  .row { display: flex; gap: 8px; }
  button { height: 40px; border: 0; border-radius: 8px; padding: 0 14px; font: 600 14px system-ui, sans-serif; cursor: pointer; background: var(--navy3); color: #fff; }
  button.go { background: var(--green); color: var(--navy); }
  .msg { font-size: 13px; min-height: 20px; color: var(--grey); }
  .msg.good { color: var(--green); } .msg.bad { color: var(--red); }
  .stats { font-size: 13px; color: var(--grey); border-top: 1px solid var(--navy3); padding-top: 12px; }
  .stats b { color: #fff; }
</style>
</head>
<body>
<header><img src="icon48.png" alt=""><h1>Chat Scraper — Settings</h1></header>
<main>
  <p style="margin:0;color:var(--grey);font-size:14px">Every captured line is saved on this laptop and uploaded to the web app. Ask an owner for a device key.</p>
  <label>Server URL <input id="url" type="url" placeholder="https://ops.example.com" autocomplete="off"></label>
  <label>Device API key <input id="key" type="password" placeholder="wn_…" autocomplete="off"></label>
  <div class="row">
    <button class="go" id="save">Save</button>
    <button id="test">Test connection</button>
    <button id="flush">Upload now</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="stats" id="stats"></div>
</main>
<script src="options.js"></script>
</body>
</html>
